<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cube-top-grad" x1="128" y1="20" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4F4F5" />
      <stop offset="100%" stop-color="#D4D4D8" />
    </linearGradient>
    <linearGradient id="cube-left-grad" x1="34.5" y1="74" x2="128" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A1A1AA" />
      <stop offset="100%" stop-color="#52525B" />
    </linearGradient>
    <linearGradient id="cube-right-grad" x1="221.5" y1="74" x2="128" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3F3F46" />
      <stop offset="100%" stop-color="#18181B" />
    </linearGradient>
    <linearGradient id="bolt-lower-grad" x1="128" y1="122" x2="128" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4F4F5" />
      <stop offset="100%" stop-color="#D4D4D8" />
    </linearGradient>
  </defs>

  <!-- Outer Isometric Cube (Cursor-style 3D shaded faces) -->
  <g id="outer-cube">
    <polygon id="cube-top-face" points="128,20 221.5,74 128,128 34.5,74" fill="url(#cube-top-grad)" />
    <polygon id="cube-left-face" points="34.5,74 128,128 128,236 34.5,182" fill="url(#cube-left-grad)" />
    <polygon id="cube-right-face" points="128,128 221.5,74 221.5,182 128,236" fill="url(#cube-right-grad)" />
  </g>

  <!-- Inner Carved Isometric Chamber (r=76, vertices welded at 128,52 and 128,204) -->
  <g id="inner-chamber">
    <polygon id="chamber-inner-left" points="128,52 128,128 62.2,166 62.2,90" fill="#141417" />
    <polygon id="chamber-inner-right" points="128,52 193.8,90 193.8,166 128,128" fill="#232329" />
    <polygon id="chamber-inner-floor" points="62.2,166 128,128 193.8,166 128,204" fill="#09090B" />
  </g>

  <!-- Trapped Faceted Lightning Bolt (100% locked inside 128,52 -> 128,204) -->
  <g id="trapped-lightning-bolt">
    <!-- 3D Extrusion Bevels (strictly inside chamber vertices) -->
    <polygon id="bolt-bevel-upper" points="128,52 136,56.6 140,122 132,122" fill="#A1A1AA" />
    <polygon id="bolt-bevel-lower" points="174,122 182,126.6 128,204 174,122" fill="#71717A" />
    <polygon id="bolt-bevel-step" points="82,134 90,138.6 124,138.6 124,134" fill="#52525B" />

    <!-- Main Bolt Lower/Right Facet -->
    <polygon id="bolt-main-face" points="128,52 82,134 124,134 128,204 174,122 132,122" fill="url(#bolt-lower-grad)" />

    <!-- Main Bolt Upper/Left Crisp White Facet (split along center axis 128,128) -->
    <polygon id="bolt-light-facet" points="128,52 82,134 128,128 132,122" fill="#FFFFFF" />
  </g>
</svg>
