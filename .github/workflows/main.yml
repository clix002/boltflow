name: BoltFlow CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "staging"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Lint, Typecheck & API Tests
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://user:password@localhost:5432/database?schema=public"
      JWT_SECRET: "ci_jwt_secret_key_for_testing_minimum_32_chars"
      REFRESH_SECRET: "ci_refresh_secret_key_for_testing_min_32_chars"
      FRONTEND_URL: "http://localhost:3001"
      BACKEND_URL: "http://localhost:3000"
      GITHUB_REPO: "clix002/boltflow"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: database
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies & generate Prisma Client
        run: bun install --frozen-lockfile

      - name: Apply Prisma migrations to test DB
        working-directory: apps/api
        run: bun run prisma migrate deploy

      - name: Run Biome Lint
        run: bun run lint

      - name: Run TypeScript Check
        run: bun run check-types

      - name: Run Backend Integration Tests
        working-directory: apps/api
        run: bun test
